<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Muhammad Shakeeb | Portfolio</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{background:#05010f;color:white;overflow-x:hidden}
.orb{position:fixed;border-radius:50%;filter:blur(70px);opacity:.55;z-index:0}
.o1{width:300px;height:300px;background:#7c3aed;top:-50px;left:-50px}
.o2{width:280px;height:280px;background:#06b6d4;bottom:10%;right:-80px}
nav{position:fixed;top:0;width:100%;z-index:99;display:flex;justify-content:center;gap:14px;padding:14px;background:rgba(0,0,0,.65);backdrop-filter:blur(12px);flex-wrap:wrap}
nav a{color:#5eead4;text-decoration:none;font-weight:700;font-size:13px}
.hero{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:95px 20px 40px;position:relative;z-index:1}
.photo-wrap{width:210px;height:210px;border-radius:50%;padding:6px;background:linear-gradient(45deg,#a855f7,#06b6d4,#ec4899,#facc15);background-size:300% 300%;cursor:pointer}
.photo-wrap img{width:100%;height:100%;object-fit:cover;border-radius:50%;border:4px solid #05010f}
h1{font-size:50px;line-height:1.05;margin:20px 0 8px;background:linear-gradient(90deg,#fff,#a78bfa,#22d3ee);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.typing{color:#facc15;font-size:20px;font-weight:700;min-height:28px}
.badge{margin-top:14px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);padding:10px 18px;border-radius:999px;font-size:14px}
.live-dot{display:inline-block;width:10px;height:10px;background:#22c55e;border-radius:50%;margin-right:6px}
.btns{display:flex;gap:12px;margin-top:20px;flex-wrap:wrap;justify-content:center}
.btn{padding:13px 24px;border-radius:999px;text-decoration:none;font-weight:800;border:none;cursor:pointer;font-size:15px}
.btn-w{background:white;color:black}.btn-b{background:#0ea5e9;color:white}.btn-y{background:#facc15;color:black}
section{max-width:900px;margin:30px auto;padding:0 20px;position:relative;z-index:1}
.card{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:24px;padding:28px;margin-bottom:24px;backdrop-filter:blur(10px)}
.card h2{color:#5eead4;font-size:28px;margin-bottom:14px}
.card p{line-height:1.7;color:#e2e8f0;font-size:17px}
.edu{border-left:4px solid #22d3ee;padding-left:16px;margin:18px 0}
.edu b{color:#facc15;font-size:18px}.edu span{color:#cbd5e1}
.official{display:inline-block;margin-top:8px;background:#111827;border:1px solid #22d3ee;color:#67e8f9;padding:8px 14px;border-radius:999px;text-decoration:none;font-size:13px;font-weight:700}
.bar-bg{background:rgba(255,255,255,.1);border-radius:999px;height:14px;margin:8px 0 16px;overflow:hidden}
.bar{height:100%;border-radius:999px;background:linear-gradient(90deg,#a855f7,#22d3ee);width:0;transition:1.5s}
.project{background:rgba(255,255,255,.06);border-radius:18px;padding:18px;margin-top:14px}
.project b{color:#facc15;font-size:18px}
.terminal{background:#000;border:1px solid #22c55e;border-radius:16px;padding:18px;text-align:left;font-family:monospace;font-size:14px;line-height:1.6;min-height:130px;color:#4ade80}
.quote-box{margin-top:14px;background:rgba(250,204,21,.1);border:1px solid #facc15;border-radius:16px;padding:16px;text-align:center;color:#fde68a;font-style:italic;font-size:17px;min-height:60px}
.ai-card{border:2px solid #a855f7 !important;background:rgba(168,85,247,.12) !important}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.quick button{background:#1e293b;color:#a5f3fc;border:1px solid #
